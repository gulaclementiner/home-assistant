mode: single
max_exceeded: silent
variables:
  light_entity: light.lvrm_all_lights_group
  kelvin_ladder: 2237, 2890, 4291, 6410
  brightness_step: 33
triggers:
  - trigger: event.received
    target:
      entity_id: event.kvardagsrum_button_1
    options:
      event_type:
        - short_release
    id: button_1_short
  - trigger: event.received
    target:
      entity_id: event.kvardagsrum_button_1
    options:
      event_type:
        - long_release
    id: button_1_long
  - trigger: event.received
    target:
      entity_id: event.kvardagsrum_button_2
    options:
      event_type:
        - initial_press
    id: button_2_press
  - trigger: event.received
    target:
      entity_id: event.kvardagsrum_button_3
    options:
      event_type:
        - initial_press
    id: button_3_press
  - trigger: event.received
    target:
      entity_id: event.kvardagsrum_button_4
    options:
      event_type:
        - short_release
    id: button_4_short
  - trigger: event.received
    target:
      entity_id: event.kvardagsrum_button_4
    options:
      event_type:
        - long_release
    id: button_4_long
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: button_1_short
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.lvrm_all_lights_group
            data:
              brightness: >
                {% set ladder = kelvin_ladder.split(",") | map("trim") | map("int") | list %} 
                {% set kelvin = state_attr(light_entity, "color_temp_kelvin") | int(1000) %} 
                {% if kelvin < ladder[0] or kelvin >= ladder[-1] %} 150 {% else %} 255 {% endif %}
              color_temp_kelvin: >
                {% set ladder = kelvin_ladder.split(",") | map("trim") | map("int") | list %} 
                {% set kelvin = state_attr(light_entity, "color_temp_kelvin") | int(1000) %} 
                {% set idx = ladder | select("le", kelvin) | list | length %} 
                {{ ladder[idx % (ladder | length)] }}
      
      - conditions:
          - condition: trigger
            id: button_1_long
        sequence:
          - if:
              - condition: state
                entity_id: input_select.lvrm_light_control_mode
                state:
                  - "Full Auto"
                  - "Manual Intercept"
            then:
              - action: light.turn_on
                target:
                  entity_id: light.lvrm_all_lights_group
                data:
                  flash: short
              - action: input_select.select_option
                target:
                  entity_id: input_select.lvrm_light_control_mode
                data:
                  option: "Full Manual"
            else:
              - action: light.turn_on
                target:
                  entity_id: light.lvrm_all_lights_group
                data:
                  brightness: >
                    {% set ladder = kelvin_ladder.split(",") | map("trim") | map("int") | list %} 
                    {% set kelvin = state_attr(light_entity, "color_temp_kelvin") | int(1000) %} 
                    {% if kelvin < ladder[0] or kelvin >= ladder[-1] %} 150 {% else %} 255 {% endif %}
                  color_temp_kelvin: >
                    {% set ladder = kelvin_ladder.split(",") | map("trim") | map("int") | list %} 
                    {% set kelvin = state_attr(light_entity, "color_temp_kelvin") | int(1000) %} 
                    {% set idx = ladder | select("le", kelvin) | list | length %} 
                    {{ ladder[idx % (ladder | length)] }}
      
      - conditions:
          - condition: trigger
            id: button_2_press
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.lvrm_all_lights_group
            data:
              brightness_step_pct: '{{ brightness_step }}'
      
      - conditions:
          - condition: trigger
            id: button_3_press
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.lvrm_all_lights_group
            data:
              brightness_step_pct: "-{{ brightness_step }}"
      
      - conditions:
          - condition: trigger
            id: button_4_short
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: input_select.lvrm_light_control_mode
                    state: "Restore Scene"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: scene.living_room_restore_scene
            default:
              - action: light.turn_off
                target:
                  entity_id: light.lvrm_all_lights_group
      
      - conditions:
          - condition: trigger
            id: button_4_long
        sequence:
          - action: light.turn_off
            target:
              entity_id: light.lvrm_all_lights_group

  - if:
      - condition: trigger
        id:
          - button_2_press
          - button_3_press
    then:
      - action: input_select.select_option
        target:
          entity_id: input_select.lvrm_light_control_mode
        data:
          option: "Manual Intercept"

alias: Light Switch Control v2.2
description: ''
