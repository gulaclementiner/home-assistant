blueprint:
  name: Light Switch Control v2.1
  description: >-
    Control a light with a 4-button Hue remote. Button 1: short press cycles
    color temperature through the kelvin ladder, long press flashes the light
    and switches the mode dropdown to Full Manual (or cycles color temperature
    otherwise). Button 2/3: brightness up/down (switches the mode dropdown to
    Manual Intercept). Button 4: short press turns the light off, or activates
    the restore scene when the mode dropdown is Restore Scene; long press turns
    the light off. The mode dropdown (input_select) must have the options:
    Full Auto, Manual Intercept, Full Manual, Restore Scene. The remote must
    expose button event entities supporting the event types initial_press,
    short_release and long_release (Hue dimmer switch / light switch).

    Release note: v2.1 - fixed service data (data_template -> data) so the
    blueprint imports without a validation error.
  domain: automation
  source_url: https://github.com/gulaclementiner/home-assistant/blob/main/blueprints/hue-light-switch.yaml
  homeassistant:
    min_version: "2026.9.0"
  input:
    remote:
      name: Remote buttons
      icon: mdi:remote
      input:
        button_1:
          name: Button 1 (color temperature / flash)
          selector:
            entity:
              filter:
                - domain: event
                  device_class: button
        button_2:
          name: Button 2 (brightness up)
          selector:
            entity:
              filter:
                - domain: event
                  device_class: button
        button_3:
          name: Button 3 (brightness down)
          selector:
            entity:
              filter:
                - domain: event
                  device_class: button
        button_4:
          name: Button 4 (off / restore scene)
          selector:
            entity:
              filter:
                - domain: event
                  device_class: button
    light:
      name: Light, mode & scene
      icon: mdi:lightbulb
      input:
        light:
          name: Light to control
          description: A single light entity (or light group). Its color_temp_kelvin attribute is read for cycling.
          selector:
            entity:
              domain: light
        mode_select:
          name: Light control mode dropdown
          description: >-
            input_select with the options: Full Auto, Manual Intercept,
            Full Manual, Restore Scene.
          selector:
            entity:
              domain: input_select
        scene:
          name: Scene to restore
          description: Previous light setting scene, activated by button 4 in Restore Scene mode.
          selector:
            entity:
              domain: scene
    settings:
      name: Settings
      icon: mdi:cog
      collapsed: true
      input:
        kelvin_ladder:
          name: Color temperature ladder (Kelvin)
          description: Comma-separated values, cycled by button 1 short press.
          default: "2237, 2890, 4291, 6410"
          selector:
            text:
              multiline: false
        brightness_step:
          name: Brightness step
          description: Percentage step for button 2/3.
          default: 33
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"

mode: single
max_exceeded: silent

variables:
  light_entity: !input light
  kelvin_ladder: !input kelvin_ladder
  brightness_step: !input brightness_step

triggers:
  - trigger: event.received
    target:
      entity_id: !input button_1
    options:
      event_type:
        - short_release
    id: "button_1_short"
  - trigger: event.received
    target:
      entity_id: !input button_1
    options:
      event_type:
        - long_release
    id: "button_1_long"
  - trigger: event.received
    target:
      entity_id: !input button_2
    options:
      event_type:
        - initial_press
    id: "button_2_press"
  - trigger: event.received
    target:
      entity_id: !input button_3
    options:
      event_type:
        - initial_press
    id: "button_3_press"
  - trigger: event.received
    target:
      entity_id: !input button_4
    options:
      event_type:
        - short_release
    id: "button_4_short"
  - trigger: event.received
    target:
      entity_id: !input button_4
    options:
      event_type:
        - long_release
    id: "button_4_long"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: button_1_short
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light
            data:
              brightness: >
                {% set ladder = kelvin_ladder | split(",") | map("trim") | map("int") | list %}
                {% set kelvin = state_attr(light_entity, "color_temp_kelvin") | int(1000) %}
                {% if kelvin < ladder[0] or kelvin >= ladder[-1] %} 150 {% else %} 255 {% endif %}
              color_temp_kelvin: >
                {% set ladder = kelvin_ladder | split(",") | map("trim") | map("int") | list %}
                {% set kelvin = state_attr(light_entity, "color_temp_kelvin") | int(1000) %}
                {% set idx = ladder | select("le", kelvin) | list | length %}
                {{ ladder[idx % ladder | length] }}
      - conditions:
          - condition: trigger
            id: button_1_long
        sequence:
          - if:
              - condition: select.is_option_selected
                target:
                  entity_id: !input mode_select
                options:
                  behavior: any
                  for: "00:00:00"
                  option:
                    - Full Auto
                    - Manual Intercept
            then:
              - action: light.turn_on
                target:
                  entity_id: !input light
                data:
                  flash: short
              - action: input_select.select_option
                target:
                  entity_id: !input mode_select
                data:
                  option: Full Manual
            else:
              - action: light.turn_on
                target:
                  entity_id: !input light
                data:
                  brightness: >
                    {% set ladder = kelvin_ladder | split(",") | map("trim") | map("int") | list %}
                    {% set kelvin = state_attr(light_entity, "color_temp_kelvin") | int(1000) %}
                    {% if kelvin < ladder[0] or kelvin >= ladder[-1] %} 150 {% else %} 255 {% endif %}
                  color_temp_kelvin: >
                    {% set ladder = kelvin_ladder | split(",") | map("trim") | map("int") | list %}
                    {% set kelvin = state_attr(light_entity, "color_temp_kelvin") | int(1000) %}
                    {% set idx = ladder | select("le", kelvin) | list | length %}
                    {{ ladder[idx % ladder | length] }}
      - conditions:
          - condition: trigger
            id: button_2_press
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light
            data:
              brightness_step_pct: "{{ brightness_step }}"
      - conditions:
          - condition: trigger
            id: button_3_press
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light
            data:
              brightness_step_pct: "-{{ brightness_step }}"
      - conditions:
          - condition: trigger
            id: button_4_short
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input mode_select
                    state:
                      - Restore Scene
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: !input scene
            default:
              - action: light.turn_off
                target:
                  entity_id: !input light
      - conditions:
          - condition: trigger
            id: button_4_long
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input light
  - if:
      - condition: trigger
        id:
          - button_2_press
          - button_3_press
    then:
      - action: input_select.select_option
        target:
          entity_id: !input mode_select
        data:
          option: Manual Intercept
